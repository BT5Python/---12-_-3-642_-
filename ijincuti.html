<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Riwayat Hidup</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 20px; color: #333; }
        .container { max-width: 700px; background: #fff; padding: 30px; margin: 0 auto; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        fieldset { border: 1px solid #ddd; padding: 20px; margin-bottom: 20px; border-radius: 5px; }
        legend { font-weight: bold; padding: 0 10px; color: #3498db; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="text"], input[type="email"], input[type="tel"], input[type="date"], select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        textarea { resize: vertical; }
        .radio-group, .checkbox-group { display: flex; gap: 15px; align-items: center; margin-top: 5px; }
        .radio-group label, .checkbox-group label { font-weight: normal; display: inline; }
        button { background-color: #3498db; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%; font-weight: bold; }
        button:hover { background-color: #2980b9; }
    </style>
</head>
<body>

<div class="container">
    <h2>Formulir Riwayat Hidup</h2>
    
    <!-- Ganti action="/proses-cv.php" dengan file pemroses backend kamu -->
    <form action="/proses-cv.php" method="POST" enctype="multipart/form-data">
        
        <!-- DATA PRIBADI -->
        <fieldset>
            <legend>Data Pribadi</legend>
            
            <div class="form-group">
                <label for="nama">Nama Lengkap:</label>
                <input type="text" id="nama" name="nama" required placeholder="Contoh: Budi Santoso">
            </div>

            <div class="form-group">
                <label>Jenis Kelamin:</label>
                <div class="radio-group">
                    <label><input type="radio" name="jk" value="Laki-laki" required> Laki-laki</label>
                    <label><input type="radio" name="jk" value="Perempuan"> Perempuan</label>
                </div>
            </div>

            <div class="form-group">
                <label for="tgl_lahir">Tanggal Lahir:</label>
                <input type="date" id="tgl_lahir" name="tgl_lahir" required>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required placeholder="nama@email.com">
            </div>

            <div class="form-group">
                <label for="telepon">Nomor Telepon / WA:</label>
                <input type="tel" id="telepon" name="telepon" required placeholder="Contoh: 08123456789">
            </div>

            <div class="form-group">
                <label for="alamat">Alamat Domisili:</label>
                <textarea id="alamat" name="alamat" rows="3" required placeholder="Tulis alamat lengkap saat ini..."></textarea>
            </div>
        </fieldset>

        <!-- RIWAYAT PENDIDIKAN -->
        <fieldset>
            <legend>Riwayat Pendidikan Terakhir</legend>
            
            <div class="form-group">
                <label for="pendidikan">Jenjang Pendidikan:</label>
                <select id="pendidikan" name="pendidikan" required>
                    <option value="">-- Pilih Pendidikan --</option>
                    <option value="SMA/SMK">SMA / SMK / Sederajat</option>
                    <option value="D3">Diploma (D3)</option>
                    <option value="S1/D4">Sarjana (S1 / D4)</option>
                    <option value="S2">Magister (S2)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="institusi">Nama Sekolah / Universitas:</label>
                <input type="text" id="institusi" name="institusi" required placeholder="Contoh: Universitas Indonesia">
            </div>

            <div class="form-group">
                <label for="jurusan">Jurusan / Program Studi:</label>
                <input type="text" id="jurusan" name="jurusan" placeholder="Contoh: Teknik Informatika">
            </div>
        </fieldset>

        <!-- PENGALAMAN & KEAHLIAN -->
        <fieldset>
            <legend>Pengalaman & Keahlian</legend>
            
            <div class="form-group">
                <label for="pengalaman">Riwayat Pengalaman Kerja / Organisasi:</label>
                <textarea id="pengalaman" name="pengalaman" rows="4" placeholder="Tulis posisi, nama perusahaan, dan tahun bekerja..."></textarea>
            </div>

            <div class="form-group">
                <label for="keahlian">Keahlian (Skill):</label>
                <input type="text" id="keahlian" name="keahlian" placeholder="Contoh: HTML, CSS, JavaScript, Microsoft Office">
            </div>

            <div class="form-group">
                <label for="foto">Unggah Foto Profil / CV PDF:</label>
                <input type="file" id="foto" name="foto" accept=".jpg,.jpeg,.png,.pdf">
            </div>
        </fieldset>

        <!-- TOMBOL SUBMIT -->
        <button type="submit">Kirim Daftar Riwayat Hidup</button>

    </form>
</div>

</body>
</html>
