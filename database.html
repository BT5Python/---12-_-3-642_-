<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>PORTAL MONITORING TERMINAL — DATABASE</title>

<style>
* { box-sizing: border-box; }

body{
    font-family: 'Courier New', monospace;
    background: linear-gradient(rgba(0,0,0,0.88),rgba(0,0,0,0.88)), url('BT5.jpg');
    background-size: cover;
    background-position: center;
    color: #00FF00;
    margin: 0;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
}

/* ---------- HEADER RAPET ---------- */
header {
    padding: 6px 10px;
    text-align: center;
    border-bottom: 1px solid #00FF00;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(4px);
}

.title {
    font-size: 30px;
    margin: 0;
    line-height: 1.2;
}

.title span {
    display: block;
    font-size: 14px;
    color: #FF0000;
    letter-spacing: 2px;
    animation: blinkText 1s infinite;
}

/* ---------- BUTTON RAPET ---------- */
.header-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    justify-content: center;
    margin-top: 5px;
}

.header-buttons button {
    background: transparent;
    border: 1px solid #00FF00;
    color: #00FF00;
    padding: 5px 8px;
    font-size: 11px;
    cursor: pointer;
    border-radius: 3px;
    font-family:'Courier New', monospace;
    transition: 0.2s;
}

.header-buttons button:hover {
    background:#00FF00;
    color:#000;
}

/* ---------- MAIN ---------- */
.main-container {
    display:flex;
    flex:1;
    min-height:0;
}

.search-panel {
    width:30%;
    padding:12px;
    border-right:1px solid #00FF00;
    overflow-y:auto;
}

.output-panel {
    flex:1;
    padding:12px;
    overflow-y:auto;
}

/* ---------- INPUT ---------- */
input, select {
    background:transparent;
    border:1px solid #00FF00;
    color:#00FF00;
    padding:6px;
    margin-bottom:8px;
    font-size:13px;
}

/* ---------- PROFILE ---------- */
.agent-profile {
    display:flex;
    gap:15px;
    flex-wrap:wrap;
}

.agent-profile pre {
    font-size:13px;
    line-height:1.3;
}

.agent-profile img {
    width:120px;
    height:160px;
    border:1px solid #00FF00;
}

/* ---------- ANIM ---------- */
@keyframes blinkText{
  0%,50%,100%{opacity:1}
  25%,75%{opacity:0}
}

.recording-indicator {
    position:fixed;
    top:8px;
    left:10px;
    color:#FF0000;
    font-size:14px;
    animation:blinkText 1s infinite;
}
</style>
</head>

<body>

<div class="recording-indicator">● RECORDING</div>

<header>
    <h1 class="title">
        INTEGRATED MONITORING SYSTEM
        <span>DATABASE</span>
    </h1>

    <div class="header-buttons">
        <button onclick="goTo('strukturorganisasinew.html')">STRUKTUR</button>
        <button onclick="goTo('masakemasa.html')">MASA</button>
        <button onclick="goTo('Jabkosong.html')">KOSONG</button>
        <button onclick="goTo('personelpuslat.html')">PERSONEL</button>
        <button onclick="goTo('pemuktahirandata.html')">UPDATE</button>
        <button onclick="goTo('riwayathidup.html')">RIWAYAT</button>
        <button onclick="goTo('ku1.html')">KU-1</button>
        <button onclick="goTo('jarkombra.html')">JARKOM</button>
        <button onclick="goTo('bankfile.html')">BANK</button>
        <button onclick="goTo('sisteminformasi.html')">SISINFO</button>
        <button onclick="goTo('emergencybox.html')">EMERGENCY</button>
        <button onclick="goTo('index.html')">LOGOUT</button>
        <button onclick="showOnlineUsers()">ONLINE</button>
    </div>
</header>

<div class="main-container">

    <div class="search-panel">
        <h3>PUSLAT</h3>

        <select id="category-filter">
            <option value="">ALL</option>
        </select>

        <input type="text" id="search" placeholder="Search..." />

        <div id="member-buttons"></div>
    </div>

    <div class="output-panel">
        <div class="agent-profile">
            <pre id="agent-dossier">READY...</pre>
            <img id="agent-photo" />
        </div>
    </div>

</div>

<script>
function goTo(url){ location.href = url; }

/* DATA SIMULASI (AMAN TANPA API) */
const data = [
 {nama:"AHMAD", jabatan:"INSTRUKTUR", pangkat:"LETDA", usia:30},
 {nama:"BUDI", jabatan:"OPERATOR", pangkat:"SERKA", usia:35}
];

const container = document.getElementById("member-buttons");
const output = document.getElementById("agent-dossier");

data.forEach(p=>{
  const btn = document.createElement("button");
  btn.textContent = p.nama;
  btn.onclick = ()=> show(p);
  container.appendChild(btn);
});

function show(p){
  output.textContent =
`NAMA    : ${p.nama}
PANGKAT : ${p.pangkat}
JABATAN : ${p.jabatan}
USIA    : ${p.usia}`;
}

function showOnlineUsers(){
  alert("USER ONLINE:\n- USER01\n- USER02");
}
</script>

</body>
</html>
